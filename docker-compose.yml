services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: graqivo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: graqivo
    ports: ['127.0.0.1:${POSTGRES_PORT:-55439}:5432']
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U graqivo']
      interval: 5s
      timeout: 3s
      retries: 20
  storage:
    image: chrislusf/seaweedfs:4.37
    command: server -dir=/data -s3 -s3.config=/etc/seaweedfs/s3.json -ip=127.0.0.1 -ip.bind=0.0.0.0 -volume.max=32 -master.volumeSizeLimitMB=100
    ports: ['127.0.0.1:9010:8333']
    volumes:
      - storage-data:/data
      - ./.local/storage/s3.json:/etc/seaweedfs/s3.json:ro
  mailpit:
    image: axllent/mailpit:v1.27.8
    ports: ['127.0.0.1:1025:1025', '127.0.0.1:8025:8025']
volumes:
  postgres-data:
  minio-data:
  storage-data:
