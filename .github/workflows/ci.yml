name: Application checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://graqivo:ci_password@localhost:5432/graqivo
      TEST_DATABASE_URL: postgresql://graqivo:ci_password@localhost:5432/graqivo_test
      FRONTEND_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      BETTER_AUTH_URL: http://localhost:4000
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_SECURE: 'false'
      EMAIL_FROM_ADDRESS: no-reply@graqivo.local
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: graqivo
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: graqivo
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U graqivo"
          --health-interval 5s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:latest
        ports: ['1025:1025', '8025:8025']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Generate isolated test authentication secret
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_ENV, 'BETTER_AUTH_SECRET=' + require('crypto').randomBytes(48).toString('hex') + '\n')"
      - run: npm run db:generate
      - run: npm run db:migrate
      - name: Create isolated test database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE graqivo_test'
      - name: Migrate isolated test database
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://graqivo:ci_password@localhost:5432/graqivo_test
      - run: npm run test:database
      - run: npm run test:phase2
      - run: npm run test:email -w @graqivo/api
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          NODE_ENV: production
      - run: npm run format:check
